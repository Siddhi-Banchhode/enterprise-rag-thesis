# docker-compose.yml — Enterprise RAG System
# Run both Streamlit and FastAPI simultaneously:
#   docker-compose up

version: "3.9"

services:

  streamlit:
    build: .
    command: streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data          # persist FAISS index and eval results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build: .
    command: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
